<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>اتصال کیف پول TON</title>
<style>
body {
    background: #101827;
    color: white;
    font-family: sans-serif;
    text-align: center;
    padding: 30px;
}
.card {
    background: #1e293b;
    padding: 25px;
    border-radius: 15px;
}
#address {
    overflow-wrap: anywhere;
    direction: ltr;
}
</style>
</head>
<body>
<div class="card">
<h2>اتصال خودکار کیف پول</h2>
<p>محفظة TON عبر TON Connect</p>
<div id="ton-connect"></div>
<p id="status">در انتظار اتصال...</p>
<p id="address"></p>
<button id="disconnect" hidden>قطع الاتصال</button>
<p>این صفحه فقط برای آزمایش اتصال است و هیچ تراکنشی انجام نمی‌دهد.</p>
</div>

<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
<script>
const statusBox = document.getElementById("status");
const addressBox = document.getElementById("address");
const disconnectButton = document.getElementById("disconnect");

if (!window.TON_CONNECT_UI) {
    statusBox.textContent = "کتابخانه اتصال بارگذاری نشد.";
} else {
    const ui = new TON_CONNECT_UI.TonConnectUI({
        manifestUrl: window.location.origin + "/tonconnect-manifest.json",
        buttonRootId: "ton-connect"
    });

    ui.onStatusChange(wallet => {
        if (wallet) {
            statusBox.textContent = "اتصال موفق بود.";
            addressBox.textContent = wallet.account.address;
            disconnectButton.hidden = false;
        } else {
            statusBox.textContent = "کیف پول متصل نیست.";
            addressBox.textContent = "";
            disconnectButton.hidden = true;
        }
    });

    disconnectButton.addEventListener("click", () => ui.disconnect());
}
</script>
</body>
  </html>
